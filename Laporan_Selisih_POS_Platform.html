<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Selisih POS - Platform | Hisana</title>
<style>
  :root {
    --merah:#dc2626; --merah-bg:#fee2e2;
    --kuning:#d97706; --kuning-bg:#fef3c7;
    --hijau:#16a34a; --hijau-bg:#dcfce7;
    --biru:#2563eb; --abu:#6b7280; --abu-bg:#f3f4f6;
    --bg:#f8fafc; --card:#ffffff; --border:#e5e7eb; --text:#111827;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { background:#1e293b; color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:18px; margin:0; }
  header .sub { font-size:12px; color:#cbd5e1; }
  #userbar { display:flex; align-items:center; gap:12px; font-size:13px; }
  #userbar button { background:#334155; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
  main { max-width:1100px; margin:0 auto; padding:20px; }

  /* --- LOGIN --- */
  #login { max-width:380px; margin:60px auto; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; }
  #login h2 { margin-top:0; font-size:18px; }
  .roles { display:flex; gap:10px; margin-bottom:16px; }
  .role-btn { flex:1; padding:14px; border:2px solid var(--border); border-radius:8px; background:#fff; cursor:pointer; font-size:14px; font-weight:600; }
  .role-btn.active { border-color:var(--biru); background:#eff6ff; color:var(--biru); }
  #login label { display:block; font-size:13px; color:var(--abu); margin:12px 0 4px; }
  #login select, #login input { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  #login button.submit { width:100%; margin-top:18px; padding:12px; background:var(--biru); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  #login-error { color:var(--merah); font-size:13px; margin-top:10px; display:none; }

  /* --- DASHBOARD --- */
  #dash { display:none; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .kpi .label { font-size:12px; color:var(--abu); }
  .kpi .value { font-size:20px; font-weight:700; margin-top:4px; }

  .filters { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .filters select { padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; }

  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  th, td { padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid var(--border); }
  th { background:#f1f5f9; font-size:11px; text-transform:uppercase; color:var(--abu); }
  tr.rowclick { cursor:pointer; }
  tr.rowclick:hover { background:#f8fafc; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  .badge.hijau { background:var(--hijau-bg); color:var(--hijau); }
  .badge.kuning { background:var(--kuning-bg); color:var(--kuning); }
  .badge.merah { background:var(--merah-bg); color:var(--merah); }
  .badge.abu { background:var(--abu-bg); color:var(--abu); }

  #empty { text-align:center; padding:40px; color:var(--abu); }

  /* --- MODAL ACTION PLAN --- */
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; align-items:flex-start; justify-content:center; padding:30px 14px; overflow:auto; }
  #modal { background:#fff; border-radius:12px; padding:20px; max-width:520px; width:100%; }
  #modal h3 { margin-top:0; font-size:15px; }
  #modal .meta { font-size:12px; color:var(--abu); margin-bottom:14px; }
  .comments { max-height:220px; overflow:auto; margin-bottom:14px; border:1px solid var(--border); border-radius:8px; }
  .comment { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
  .comment:last-child { border-bottom:none; }
  .comment .who { font-weight:700; font-size:12px; }
  .comment .when { color:var(--abu); font-size:11px; float:right; }
  .comment .foto-thumb { display:block; margin-top:8px; max-width:160px; max-height:160px; border-radius:6px; border:1px solid var(--border); cursor:pointer; }
  #modal textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; font-size:13px; min-height:70px; font-family:inherit; }
  #modal label.field-label { display:block; font-size:12px; color:var(--abu); margin:10px 0 4px; }
  #modal input[type=file] { width:100%; font-size:12px; }
  #modal .modal-actions { display:flex; gap:8px; margin-top:10px; }
  #modal .modal-actions button { flex:1; padding:10px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
  #modal .btn-close { background:var(--abu-bg); color:var(--text); }
  #modal .btn-save { background:var(--biru); color:#fff; }

  #loading, #err-banner { text-align:center; padding:30px; }
  #err-banner { color:var(--merah); display:none; }

  /* --- MODAL TAMBAH DATA (khusus Kacab) --- */
  #modal-add h3 { margin-top:0; font-size:15px; }
  #modal-add label.field-label { display:block; font-size:12px; color:var(--abu); margin:10px 0 4px; }
  #modal-add select, #modal-add input { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  #modal-add textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; font-size:13px; min-height:70px; font-family:inherit; }
  #modal-add input[type=file] { width:100%; font-size:12px; }
  #add-err { color:var(--merah); font-size:12px; margin-top:6px; display:none; }
  .btn-tambah { background:var(--biru); color:#fff; border:none; padding:9px 14px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Laporan Selisih POS - Platform</h1>
    <div class="sub">Hisana Surabaya Raya</div>
  </div>
  <div id="userbar" style="display:none;">
    <span id="who"></span>
    <button onclick="logout()">Keluar</button>
  </div>
</header>

<main>

  <div id="login">
    <h2>Masuk</h2>
    <div class="roles">
      <button class="role-btn active" id="btn-kacab" onclick="pickRole('KACAB')">Kacab</button>
      <button class="role-btn" id="btn-keuangan" onclick="pickRole('KEUANGAN')">Keuangan</button>
    </div>

    <div id="kacab-select-wrap">
      <label>Pilih Kacab</label>
      <select id="kacab-select"><option>Memuat...</option></select>
    </div>

    <label>PIN</label>
    <input type="password" id="pin-input" inputmode="numeric" placeholder="Masukkan PIN">

    <button class="submit" onclick="doLogin()">Masuk</button>
    <div id="login-error">PIN salah, coba lagi.</div>
  </div>

  <div id="loading">Memuat data...</div>
  <div id="err-banner">Gagal memuat data. <button onclick="loadAll()">Coba lagi</button></div>

  <div id="dash">
    <div class="kpis" id="kpis"></div>

    <div class="filters" id="filters"></div>

    <table>
      <thead>
        <tr>
          <th>Tanggal</th><th>Gerai</th><th>Platform</th>
          <th>Omzet POS</th><th>Omzet Platform</th>
          <th>Selisih</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" style="display:none;">Belum ada data selisih untuk ditampilkan.</div>
  </div>

</main>

<div id="overlay">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <div class="meta" id="modal-meta"></div>
    <div class="comments" id="modal-comments"></div>

    <div class="modal-actions">
      <button class="btn-close" onclick="closeModal()">Tutup</button>
    </div>
  </div>
</div>

<div id="overlay-add" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; align-items:flex-start; justify-content:center; padding:30px 14px; overflow:auto;">
  <div id="modal-add" style="background:#fff; border-radius:12px; padding:20px; max-width:420px; width:100%;">
    <h3>Tambah Data Selisih</h3>

    <label class="field-label">Tanggal</label>
    <input type="date" id="add-tanggal">

    <label class="field-label">Gerai</label>
    <select id="add-gerai"></select>

    <label class="field-label">Platform</label>
    <select id="add-platform">
      <option>GoFood</option>
      <option>GrabFood</option>
      <option>ShopeeFood</option>
    </select>

    <label class="field-label">Omzet POS (Rp)</label>
    <input type="number" id="add-pos" inputmode="numeric" placeholder="0">

    <label class="field-label">Omzet Platform (Rp)</label>
    <input type="number" id="add-platform-omzet" inputmode="numeric" placeholder="0">

    <label class="field-label">Status</label>
    <select id="add-status">
      <option value="Belum Terselesaikan">Belum Terselesaikan</option>
      <option value="Selesai">Selesai</option>
    </select>

    <label class="field-label">Keterangan / Action Plan (opsional)</label>
    <textarea id="add-keterangan" placeholder="Tulis keterangan / rencana tindak lanjut kalau ada..."></textarea>

    <label class="field-label">Bukti Foto (opsional)</label>
    <input type="file" id="add-foto" accept="image/*" onchange="onFotoPickedAdd(event)">
    <img id="add-foto-preview" alt="preview" style="display:none; margin-top:8px; max-width:160px; max-height:160px; border-radius:6px; border:1px solid var(--border);">
    <div id="add-foto-status" style="font-size:11px;color:var(--abu);margin-top:4px;"></div>

    <div id="add-err">Gagal menyimpan, coba lagi.</div>

    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn-close" onclick="closeAddModal()">Batal</button>
      <button class="btn-save" id="btn-save-add" onclick="submitDataSelisih()">Simpan</button>
    </div>
  </div>
</div>

<script>
// ======= GANTI DENGAN URL WEB APP APPS SCRIPT LO (yang berakhiran /exec) =======
const API_URL = 'https://script.google.com/macros/s/AKfycbxqvMcS_OphjtjoBtAok3u1t6vPx2ul2p5VKCmOiQPuBxBU0rvIT_VBt1byGA4xL7fe/exec';
// =================================================================================
async function apiGet(action) {
  const res = await fetch(API_URL + '?action=' + action);
  return res.json();
}
async function apiPost(action, body) {
  const res = await fetch(API_URL + '?action=' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain menghindari CORS preflight
    body: JSON.stringify(body)
  });
  return res.json();
}

let STATE = {
  role: 'KACAB',
  kode: null,
  nama: null,
  pin: null,
  gerai: [],
  kacab: [],
  data: [],
  actionPlans: [],
  filterKacab: 'ALL'
};

function pickRole(role) {
  STATE.role = role;
  document.getElementById('btn-kacab').classList.toggle('active', role === 'KACAB');
  document.getElementById('btn-keuangan').classList.toggle('active', role === 'KEUANGAN');
  document.getElementById('kacab-select-wrap').style.display = role === 'KACAB' ? 'block' : 'none';
}

async function populateKacabDropdown() {
  try {
    const res = await apiGet('getData');
    STATE.gerai = res.gerai || [];
    STATE.kacab = res.kacab || [];
    const sel = document.getElementById('kacab-select');
    sel.innerHTML = STATE.kacab.map(k => `<option value="${k.kode}">${k.kode} - ${k.nama}</option>`).join('');
  } catch (e) {
    document.getElementById('kacab-select').innerHTML = '<option>Gagal memuat</option>';
  }
}

async function doLogin() {
  const pin = document.getElementById('pin-input').value.trim();
  const kode = STATE.role === 'KACAB' ? document.getElementById('kacab-select').value : 'KEUANGAN';
  if (!pin) return;
  const res = await apiPost('verifyPin', { role: STATE.role, kode, pin });
  if (res.valid) {
    STATE.kode = kode;
    STATE.pin = pin;
    STATE.nama = res.nama;
    sessionStorage.setItem('selisih_session', JSON.stringify(STATE));
    enterDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function logout() {
  sessionStorage.removeItem('selisih_session');
  location.reload();
}

function enterDashboard() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('userbar').style.display = 'flex';
  document.getElementById('who').textContent =
    (STATE.role === 'KACAB' ? 'Kacab ' + STATE.kode : 'Keuangan') + (STATE.nama ? ' - ' + STATE.nama : '');
  loadAll();
}

async function loadAll() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('err-banner').style.display = 'none';
  document.getElementById('dash').style.display = 'none';
  try {
    const res = await apiGet('getData');
    STATE.gerai = res.gerai || [];
    STATE.kacab = res.kacab || [];
    STATE.data = res.data || [];
    STATE.actionPlans = res.actionPlans || [];
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    renderFilters();
    render();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('err-banner').style.display = 'block';
  }
}

function renderFilters() {
  const box = document.getElementById('filters');
  let html = '';
  if (STATE.role === 'KEUANGAN') {
    html += `<select id="filter-kacab" onchange="STATE.filterKacab=this.value; render()">
      <option value="ALL">Semua Kacab</option>
      ${STATE.kacab.map(k => `<option value="${k.kode}">${k.kode} - ${k.nama}</option>`).join('')}
    </select>`;
  }
  if (STATE.role === 'KACAB') {
    html += `<button class="btn-tambah" onclick="openAddModal()">+ Tambah Data</button>`;
  }
  box.innerHTML = html;
}

function scopedRows() {
  let rows = STATE.data;
  if (STATE.role === 'KACAB') {
    rows = rows.filter(r => String(r['Kode Kacab']) === String(STATE.kode));
  } else if (STATE.filterKacab !== 'ALL') {
    rows = rows.filter(r => String(r['Kode Kacab']) === String(STATE.filterKacab));
  }
  return rows;
}

const STATUS_BADGE = {
  'Selesai': { label: 'Selesai', cls: 'hijau' },
  'Belum Terselesaikan': { label: 'Belum Terselesaikan', cls: 'merah' }
};
function statusFor(row) {
  const status = row['Status'];
  if (status && STATUS_BADGE[status]) return STATUS_BADGE[status];
  return { label: status || 'Belum Terselesaikan', cls: 'merah' };
}

function fmtRp(n) {
  n = Number(n) || 0;
  return 'Rp' + n.toLocaleString('id-ID');
}

function render() {
  const rows = scopedRows();
  const tbody = document.getElementById('tbody');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';

  tbody.innerHTML = rows.map((r, i) => {
    const st = statusFor(r);
    return `<tr class="rowclick" onclick="openModal(${i})">
      <td>${r['Tanggal']}</td>
      <td>${r['Nama Gerai']}</td>
      <td>${r['Platform']}</td>
      <td>${fmtRp(r['Omzet POS'])}</td>
      <td>${fmtRp(r['Omzet Platform'])}</td>
      <td>${fmtRp(r['Selisih Rp'])} (${Number(r['Selisih Persen']||0).toFixed(1)}%)</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
    </tr>`;
  }).join('');

  // KPI
  const totalSelisih = rows.reduce((a, r) => a + (Number(r['Selisih Rp']) || 0), 0);
  const besar = rows.filter(r => statusFor(r).cls === 'merah').length;
  const match = rows.filter(r => statusFor(r).cls === 'hijau').length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total Baris</div><div class="value">${rows.length}</div></div>
    <div class="kpi"><div class="label">Total Selisih</div><div class="value">${fmtRp(totalSelisih)}</div></div>
    <div class="kpi"><div class="label">Selisih</div><div class="value" style="color:var(--merah)">${besar}</div></div>
    <div class="kpi"><div class="label">Match</div><div class="value" style="color:var(--hijau)">${match}</div></div>
  `;
}

let currentRow = null;

function fotoUrl(fotoId, size) {
  return `https://drive.google.com/thumbnail?id=${fotoId}&sz=w${size || 400}`;
}
function fotoViewUrl(fotoId) {
  return `https://drive.google.com/file/d/${fotoId}/view`;
}

function processFoto(file, previewEl, statusEl, onReady) {
  if (!file) { onReady(null); return; }
  statusEl.textContent = 'Memproses foto...';
  const reader = new FileReader();
  reader.onload = function (e) {
    const img = new Image();
    img.onload = function () {
      const MAX_W = 1200;
      const scale = Math.min(1, MAX_W / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const base64 = dataUrl.split(',')[1];
      const foto = { base64, mime: 'image/jpeg', name: (file.name || 'bukti') + '.jpg' };

      previewEl.src = dataUrl;
      previewEl.style.display = 'block';
      const kb = Math.round(base64.length * 0.75 / 1024);
      statusEl.textContent = `Siap diupload (~${kb} KB)`;
      onReady(foto);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let pendingFotoAdd = null;
function onFotoPickedAdd(evt) {
  const file = evt.target.files[0];
  if (!file) { pendingFotoAdd = null; return; }
  processFoto(file, document.getElementById('add-foto-preview'), document.getElementById('add-foto-status'),
    (foto) => { pendingFotoAdd = foto; });
}

function openModal(idx) {
  currentRow = scopedRows()[idx];
  document.getElementById('modal-title').textContent =
    `${currentRow['Nama Gerai']} - ${currentRow['Platform']} (${currentRow['Tanggal']})`;
  const st = statusFor(currentRow);
  document.getElementById('modal-meta').innerHTML =
    `Selisih ${fmtRp(currentRow['Selisih Rp'])} (${Number(currentRow['Selisih Persen']||0).toFixed(1)}%) &middot; <span class="badge ${st.cls}">${st.label}</span>`;

  const comments = STATE.actionPlans.filter(a => String(a['Selisih ID']) === String(currentRow['ID']));
  const box = document.getElementById('modal-comments');
  box.innerHTML = comments.length ? comments.map(c => `
    <div class="comment">
      <span class="who">${c['Nama'] || c['Role']}</span>
      <span class="when">${new Date(c['Waktu']).toLocaleString('id-ID')}</span>
      <div>${c['Keterangan'] || ''}</div>
      ${c['Foto ID'] ? `<img class="foto-thumb" src="${fotoUrl(c['Foto ID'], 300)}" onclick="window.open('${fotoViewUrl(c['Foto ID'])}','_blank')">` : ''}
    </div>
  `).join('') : '<div class="comment" style="color:var(--abu)">Belum ada action plan.</div>';

  document.getElementById('overlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('overlay').style.display = 'none';
}

// ---- Modal Tambah Data (khusus Kacab) ----
function openAddModal() {
  const gerai = STATE.gerai.filter(g => String(g['Kode Kacab']) === String(STATE.kode));
  document.getElementById('add-gerai').innerHTML =
    gerai.map(g => `<option value="${g['Kode Gerai']}" data-nama="${g['Nama Gerai']}">${g['Nama Gerai']}</option>`).join('');
  document.getElementById('add-tanggal').value = new Date().toISOString().slice(0, 10);
  document.getElementById('add-pos').value = '';
  document.getElementById('add-platform-omzet').value = '';
  document.getElementById('add-status').value = 'Belum Terselesaikan';
  document.getElementById('add-keterangan').value = '';
  document.getElementById('add-foto').value = '';
  document.getElementById('add-foto-preview').style.display = 'none';
  document.getElementById('add-foto-status').textContent = '';
  pendingFotoAdd = null;
  document.getElementById('add-err').style.display = 'none';
  document.getElementById('overlay-add').style.display = 'flex';
}
function closeAddModal() {
  document.getElementById('overlay-add').style.display = 'none';
}

async function submitDataSelisih() {
  const tanggal = document.getElementById('add-tanggal').value;
  const geraiSel = document.getElementById('add-gerai');
  const geraiKode = geraiSel.value;
  const geraiNama = geraiSel.selectedOptions[0] ? geraiSel.selectedOptions[0].dataset.nama : '';
  const platform = document.getElementById('add-platform').value;
  const omzetPos = document.getElementById('add-pos').value;
  const omzetPlatform = document.getElementById('add-platform-omzet').value;
  const status = document.getElementById('add-status').value;
  const keterangan = document.getElementById('add-keterangan').value.trim();
  const errEl = document.getElementById('add-err');

  if (!tanggal || !geraiKode || omzetPos === '' || omzetPlatform === '') {
    errEl.textContent = 'Lengkapi semua field dulu ya.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('btn-save-add');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';
  try {
    const res = await apiPost('addDataSelisih', {
      tanggal, gerai: geraiKode, gerainama: geraiNama, platform,
      omzetPos, omzetPlatform, status, role: STATE.role, kode: STATE.kode, pin: STATE.pin
    });
    if (res.success) {
      STATE.data.push({
        'ID': res.id, 'Tanggal': tanggal, 'Kode Kacab': STATE.kode,
        'Kode Gerai': geraiKode, 'Nama Gerai': geraiNama, 'Platform': platform,
        'Omzet POS': Number(omzetPos), 'Omzet Platform': Number(omzetPlatform),
        'Selisih Rp': res.selisihRp, 'Selisih Persen': res.selisihPersen,
        'Status': res.status || status
      });

      // Kalau kacab langsung isi keterangan/action plan atau bukti foto pas nambah data,
      // kirim juga sebagai action plan pertama untuk baris ini.
      if (keterangan || pendingFotoAdd) {
        try {
          const planPayload = {
            selisihId: res.id, tanggal, keterangan,
            role: STATE.role, kode: STATE.kode, pin: STATE.pin
          };
          if (pendingFotoAdd) {
            planPayload.fotoBase64 = pendingFotoAdd.base64;
            planPayload.fotoMime = pendingFotoAdd.mime;
            planPayload.fotoName = pendingFotoAdd.name;
          }
          const planRes = await apiPost('addActionPlan', planPayload);
          if (planRes.success) {
            STATE.actionPlans.push({
              'ID': planRes.id, 'Selisih ID': res.id, 'Tanggal': tanggal,
              'Keterangan': keterangan, 'Foto ID': planRes.fotoId || '',
              'Role': STATE.role, 'Nama': planRes.nama, 'Waktu': planRes.waktu
            });
          }
        } catch (e) {
          // Data selisih sudah tersimpan; kalau action plan awal gagal terkirim, kacab
          // masih bisa menambahkannya lagi lewat modal detail baris.
        }
      }
      closeAddModal();
      render();
    } else {
      errEl.textContent = res.error || 'Gagal menyimpan, coba lagi.';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = 'Gagal menyimpan, coba lagi.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Simpan';
  }
}

// init
(function init() {
  populateKacabDropdown();
  const saved = sessionStorage.getItem('selisih_session');
  if (saved) {
    try {
      STATE = JSON.parse(saved);
      enterDashboard();
    } catch (e) {}
  }
})();
</script>

</html>
